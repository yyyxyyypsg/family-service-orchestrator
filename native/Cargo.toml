[package]
name = "family-orchestrator-native"
version = "0.1.0"
edition = "2021"
default-run = "family-orchestrator-native"

[[bin]]
name = "family-orchestrator-native"
path = "src/main.rs"
required-features = ["standalone"]

[lib]
name = "family_orchestrator_native"
path = "src/lib.rs"

[features]
default = ["standalone"]
standalone = ["dep:makepad-aichat", "dep:makepad-wm-api"]

[dependencies]
makepad-widgets = { path = "../../../makepad/widgets" }
makepad-wm-theme = { path = "../../../makepad/libs/wm_theme" }
makepad-ai-services = { path = "../../../makepad/libs/ai/services" }
makepad-strict-json = { path = "../../../makepad/libs/strict_json" }
makepad-app-module = { path = "../../../makepad/libs/app_module" }
makepad-aichat = { path = "../../../makepad/apps/aichat", default-features = false, features = ["engine"], optional = true }
makepad-wm-api = { path = "../../../makepad/libs/wm_api", optional = true }
